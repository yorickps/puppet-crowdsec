---
crowdsec::required_packages:
  - yum-utils


crowdsec::yum_gpg_archive:
  ensure: present 
  source: https://packagecloud.io/crowdsec/crowdsec/gpgkey
  creates: /tmp/RPM-GPG-KEY-CrowdSec

crowdsec::yum_gpgkey:
  /etc/pki/rpm-gpg/RPM-GPG-KEY-CrowdSec:
    #source: "puppet:///${module_name}/RPM-GPG-KEY-CrowdSec"
    source: /tmp/RPM-GPG-KEY-CrowdSec

crowdsec::yum_repo:
  crowdsec:
    enabled: true
    baseurl: "https://packagecloud.io/crowdsec/crowdsec/el/${facts.os.release.major}/$basearch"
    descr: CrowdSec
    gpgkey: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    gpgcheck: 1
    repo_gpgcheck: 0
    sslverify: 1
    sslcacert: /etc/pki/tls/certs/ca-bundle.crt
    metadata_expire: 300
