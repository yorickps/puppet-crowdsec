---
crowdsec::required_packages:
  - yum-utils

crowdsec::yum_gpg_archive:
  ensure: present 
  source: https://packagecloud.io/crowdsec/crowdsec/gpgkey
  creates: /tmp/RPM-GPG-KEY-CrowdSec

crowdsec::yum_gpgkey:
  /etc/pki/rpm-gpg/RPM-GPG-KEY-CrowdSec:
    #source: "puppet:///${module_name}/RPM-GPG-KEY-CrowdSec"
    source: /tmp/RPM-GPG-KEY-CrowdSec
