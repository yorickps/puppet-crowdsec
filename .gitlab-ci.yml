---
stages:
  - syntax
  - unit

cache:
  paths:
    - vendor/bundle

before_script:
  - bundle -v
  - rm Gemfile.lock || true
  - gem update --system
  - gem --version
  - bundle -v
  - bundle install --without system_tests --path vendor/bundle --jobs $(nproc)

syntax lint metadata_lint check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop-Ruby 2.7.8-Puppet ~> 7.35:
  stage: syntax
  image: ruby:2.7.8
  script:
    - bundle exec rake syntax lint metadata_lint check:symlinks check:git_ignore check:dot_underscore check:test_file rubocop
  variables:
    PUPPET_GEM_VERSION: '~> 7.35.0'

parallel_spec-Ruby 2.7.8-Puppet ~> 7.35.0:
  stage: unit
  image: ruby:2.7.8
  script:
    - bundle exec rake parallel_spec
  variables:
    PUPPET_GEM_VERSION: '~> 7.35.0'

parallel_spec-Ruby 3.2.5-Puppet ~> 8.11.0:
  stage: unit
  image: ruby:3.2.5
  script:
    - bundle exec rake parallel_spec
  variables:
    PUPPET_GEM_VERSION: '~> 8.11.0'